name: Validate v2.1.3 MIDI note durations

on:
  workflow_dispatch:
  push:
    branches: ["feature/midi-note-durations-v213"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test curriculum logic
        run: npm test

      - name: Production build
        run: npm run build
