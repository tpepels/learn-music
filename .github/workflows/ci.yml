name: Validate review cycle

on:
  workflow_dispatch:
  push:
    branches:
      - fix/lesson-7-8-live-audio-controls
  pull_request:
    types:
      - ready_for_review

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test curriculum logic
        run: npm test

      - name: Production build
        run: npm run build
